[user]
name = "Pablo Brasero"
email = "pablo@pablobm.com"

[[--scope]]
--when.commands = ["status"]
[--scope.ui]
paginate = "never"

[revset-aliases]
'closest_bookmark(to)' = 'heads(::to & bookmarks())'
'closest_pushable(to)' = 'heads(::to & mutable() & ~description(exact:"") & (~empty() | merges()))'

[aliases]
all = ["log", "-r", "all()"]
# tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@-"]
tug = ["util", "exec", "--", "sh", "-c", """
if [ "x$1" = "x" ]; then
  jj bookmark move --from "closest_bookmark(@)" --to "closest_pushable(@)"
else
  jj bookmark move --to "closest_pushable(@)" "$@"
fi
""", ""]

# Commenting out in order to try delta instead
# [ui]
# diff-formatter = ["difft", "--color=always", "$left", "$right"]

# Config for delta from https://github.com/jj-vcs/jj/discussions/4690#discussioncomment-14759025
[ui]
diff-formatter="delta"
[merge-tools.delta]
diff-args=["--side-by-side", "$left", "$right", "--width=$width"]

[git]
fetch = ["upstream", "origin", "pablobm"]
